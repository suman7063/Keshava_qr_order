# Auto-apply database migrations to production Supabase on every push
# to main that touches supabase/migrations/.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com/dashboard/account/tokens → Generate
#   SUPABASE_PROJECT_ID    — project ref (Dashboard → Project Settings → General)
#   SUPABASE_DB_PASSWORD   — database password (Project Settings → Database)
#
# Also one-time, from your laptop (marks already-applied migrations 001-013
# as done so the first run doesn't try to re-apply them):
#   supabase login
#   supabase link --project-ref <SUPABASE_PROJECT_ID>
#   supabase migration repair --status applied 001 002 003 004 005 006 007 008 009 010 011 012 013

name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch: {}

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Push pending migrations
        run: supabase db push
