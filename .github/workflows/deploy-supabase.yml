name: 🚀 Deploy Supabase

# ──────────────────────────────────────────────────────────────────────────────
# GitHub Secrets — yeh sab add karo:
# Settings → Secrets and variables → Actions → New repository secret
#
#  SUPABASE_ACCESS_TOKEN  → supabase.com → Account → Access Tokens
#  SUPABASE_PROJECT_REF   → cftyzgkwevutshbckrjm
#  FAST2SMS_API_KEY        → fast2sms.com account (SMS OTP ke liye, optional)
#
# Netlify env vars (Netlify Dashboard → Site → Environment Variables):
#  NEXT_PUBLIC_SUPABASE_URL
#  NEXT_PUBLIC_SUPABASE_ANON_KEY
#  SUPABASE_SERVICE_ROLE_KEY
#  NEXT_PUBLIC_MAIN_DOMAIN=bicres.com
#  DEFAULT_SUBDOMAIN=default
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations + Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push DB migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Set edge function secrets
        run: |
          if [ -n "$FAST2SMS_API_KEY" ]; then
            supabase secrets set FAST2SMS_API_KEY=$FAST2SMS_API_KEY
            echo "✅ FAST2SMS_API_KEY set"
          else
            echo "⚠️  FAST2SMS_API_KEY not set — SMS OTP disabled"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}

      - name: Deploy restaurant-lookup
        run: supabase functions deploy restaurant-lookup --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-otp
        run: supabase functions deploy send-otp --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Done
        run: echo "✅ Supabase deploy complete → https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_REF }}"
