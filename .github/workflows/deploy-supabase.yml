name: 🚀 Deploy Supabase

# ──────────────────────────────────────────────────────────────────────────────
# GitHub Secrets — yeh sab add karo:
# Settings → Secrets and variables → Actions → New repository secret
#
#  SUPABASE_ACCESS_TOKEN  → supabase.com → Account → Access Tokens
#  SUPABASE_PROJECT_REF   → your project ref
#  SUPABASE_DB_PASSWORD   → database password (Project Settings → Database)
#
# Netlify env vars (Netlify Dashboard → Site → Environment Variables):
#  NEXT_PUBLIC_SUPABASE_URL
#  NEXT_PUBLIC_SUPABASE_ANON_KEY
#  SUPABASE_SERVICE_ROLE_KEY
#  NEXT_PUBLIC_MAIN_DOMAIN=bicres.com
#  DEFAULT_SUBDOMAIN=default
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push DB migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Done
        run: echo "✅ Supabase deploy complete → https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_REF }}"
